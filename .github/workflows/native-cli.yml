name: Native CLI

on:
  push:
    paths:
      - "packages/happy-cli/package.json"
      - "packages/happy-cli/Cargo.toml"
      - "packages/happy-cli/Cargo.lock"
      - "packages/happy-cli/rust/**"
      - "packages/happy-cli/bin/**"
      - "packages/happy-cli/scripts/build-native-cli.cjs"
      - "packages/happy-cli/scripts/verify-native-cli-binaries.cjs"
      - "packages/happy-cli/scripts/unpack-tools.cjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/native-cli.yml"
  pull_request:
    paths:
      - "packages/happy-cli/package.json"
      - "packages/happy-cli/Cargo.toml"
      - "packages/happy-cli/Cargo.lock"
      - "packages/happy-cli/rust/**"
      - "packages/happy-cli/bin/**"
      - "packages/happy-cli/scripts/build-native-cli.cjs"
      - "packages/happy-cli/scripts/verify-native-cli-binaries.cjs"
      - "packages/happy-cli/scripts/unpack-tools.cjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/native-cli.yml"

jobs:
  checks:
    name: Rust checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/happy-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: x64
            runner: macos-13
            target: x86_64-apple-darwin
          - platform: darwin
            arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - platform: win32
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: win32
            arch: arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: packages/happy-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build and stage native CLI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: >-
          node scripts/build-native-cli.cjs
          --stage
          --target ${{ matrix.target }}
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
      - name: Verify binary
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            test -s "target/${{ matrix.target }}/release/happy.exe"
          else
            test -s "target/${{ matrix.target }}/release/happy"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/happy-cli/tools/cli
          if-no-files-found: error

  package-smoke:
    name: Native npm package smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-cli-*
          path: packages/happy-cli/tools/cli
          merge-multiple: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter happy native:verify-staged
      - run: pnpm --filter happy pack --pack-destination packages/happy-cli
      - name: Install and execute packaged CLI
        shell: bash
        run: |
          PACKAGE_FILE=$(find packages/happy-cli -maxdepth 1 -name 'happy-*.tgz' -print -quit)
          npm install --global "$PACKAGE_FILE"
          HAPPY_HOME_DIR="$(mktemp -d)" happy --version
          HAPPY_HOME_DIR="$(mktemp -d)" happy doctor
