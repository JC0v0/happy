[package]
name = "happy-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WASM terminal model for Happy - ANSI parsing + grid screen buffer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vte = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
