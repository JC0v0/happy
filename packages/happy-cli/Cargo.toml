[package]
name = "happy-cli"
version = "1.2.0"
edition = "2024"
description = "Native cross-platform Happy CLI"
license = "MIT"
publish = false

[[bin]]
name = "happy"
path = "rust/src/main.rs"

[lib]
path = "rust/src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
aes-gcm = "0.10.3"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
crypto_box = "0.9.1"
crypto_secretbox = "0.1.0"
ed25519-dalek = "2.2"
futures-util = "0.3"
qrcode = "0.14"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tf-rust-socketio = { version = "0.8.1", features = ["async"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
