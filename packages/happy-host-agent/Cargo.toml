[package]
name = "happy-host-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native PTY runtime for the Happy host agent"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
